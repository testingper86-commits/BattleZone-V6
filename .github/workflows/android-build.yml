name: Build BattleZone Offline Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, feature/offline-pairing-removal]
    paths:
      - '**/*.zip'
      - '.github/workflows/**'
      - 'scripts/**'
      - 'README.md'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract canonical source and remove local pairing
        id: source
        shell: bash
        run: |
          set -euo pipefail
          archive="BattleZone_V6_GitHub_Actions_Ready.zip"
          if [ ! -f "$archive" ]; then
            echo "Required canonical source archive not found: $archive"
            exit 1
          fi
          rm -rf _cloud_source
          mkdir -p _cloud_source
          unzip -oq "$archive" -d _cloud_source
          python3 scripts/apply_offline_pairing_removal.py _cloud_source
          python3 scripts/apply_gameplay_overhaul.py _cloud_source
          python3 scripts/apply_gameplay_quality.py _cloud_source
          python3 scripts/apply_offline_hub_completion.py _cloud_source
          echo "dir=_cloud_source" >> "$GITHUB_OUTPUT"
          echo "Canonical source extracted and offline-only patch applied."

      - name: Locate Android Gradle project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          source_dir="${{ steps.source.outputs.dir }}"
          settings_file="$(find "$source_dir" -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1)"
          if [ -z "$settings_file" ]; then
            echo "No settings.gradle or settings.gradle.kts found in $source_dir."
            exit 1
          fi
          project_dir="$(dirname "$settings_file")"
          if [ ! -d "$project_dir/app" ]; then
            echo "Found Gradle settings at $project_dir but no app/ module beside it."
            exit 1
          fi
          echo "dir=$project_dir" >> "$GITHUB_OUTPUT"
          echo "Project root: $project_dir"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run static source validation
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ steps.project.outputs.dir }}"
          python3 validate_project.py

      - name: Run unit tests and build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ steps.project.outputs.dir }}"
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug
          else
            gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: BattleZone-debug-APK
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Package patched Android source
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ steps.project.outputs.dir }}"
          zip -qr "$GITHUB_WORKSPACE/BattleZone_V6_Offline_Patched_Source.zip" . \
            -x '**/build/**' '**/.gradle/**' '.git/**' '*/.git/*'

      - name: Upload patched source archive
        uses: actions/upload-artifact@v4
        with:
          name: BattleZone-Offline-Patched-Source
          path: BattleZone_V6_Offline_Patched_Source.zip
          if-no-files-found: error
          retention-days: 14
