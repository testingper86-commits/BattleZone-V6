name: Build BattleZone Offline Android APK

on:
  workflow_dispatch:
  push:
    branches: [feature/offline-pairing-removal]
    paths:
      - 'BattleZone_V6_GitHub_Actions_Ready.zip'
      - '.github/workflows/**'
      - 'scripts/**'
      - 'README.md'
      - 'docs/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract canonical source and remove local pairing
        id: source
        shell: bash
        run: |
          set -euo pipefail
          archive="BattleZone_V6_GitHub_Actions_Ready.zip"
          if [ ! -f "$archive" ]; then
            echo "Required canonical source archive not found: $archive"
            exit 1
          fi
          rm -rf _cloud_source
          mkdir -p _cloud_source
          unzip -oq "$archive" -d _cloud_source
          python3 scripts/apply_offline_pairing_removal.py _cloud_source
          python3 scripts/apply_gameplay_overhaul.py _cloud_source
          python3 scripts/apply_gameplay_quality.py _cloud_source
          python3 scripts/apply_offline_hub_completion.py _cloud_source
          python3 scripts/apply_battlezone_warroom_redesign.py _cloud_source
          python3 scripts/apply_gameplay_final_polish.py _cloud_source
          python3 scripts/apply_battlezone_feedback_completion.py _cloud_source
          python3 scripts/apply_battlezone_v6_enhancement.py _cloud_source
          python3 scripts/apply_v6_runtime_reliability.py _cloud_source
          python3 scripts/apply_v6_voice_startup_fix.py _cloud_source
          python3 scripts/apply_v6_gpu_recovery.py _cloud_source
          python3 scripts/apply_v6_progression_integrity.py _cloud_source
          python3 scripts/apply_v6_squad_command_system.py _cloud_source
          python3 scripts/apply_v6_lobby_alignment.py _cloud_source
          python3 scripts/apply_v6_tactical_command_ui.py _cloud_source
          python3 scripts/apply_v6_adaptive_enemy_ai.py _cloud_source
          python3 scripts/apply_v6_animation_action_integration.py _cloud_source
          python3 scripts/apply_v6_adaptive_graphics.py _cloud_source
          python3 scripts/apply_v6_offline_webview_security.py _cloud_source
          python3 scripts/apply_v6_build_hardening.py _cloud_source
          python3 scripts/apply_battlezone_v6_overhaul.py _cloud_source
          python3 scripts/apply_battlezone_v6_rigged_weapons.py _cloud_source
          python3 scripts/apply_battlezone_v6_multimodel.py _cloud_source
          python3 scripts/apply_v6_world_tactical_integrity.py _cloud_source
          echo "dir=_cloud_source" >> "$GITHUB_OUTPUT"
          echo "Canonical source extracted and offline-only patches applied."

      - name: Locate Android Gradle project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          source_dir="${{ steps.source.outputs.dir }}"
          settings_file="$(find "$source_dir" -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1)"
          if [ -z "$settings_file" ]; then
            echo "No settings.gradle or settings.gradle.kts found in $source_dir."
            exit 1
          fi
          project_dir="$(dirname "$settings_file")"
          if [ ! -d "$project_dir/app" ]; then
            echo "Found Gradle settings at $project_dir but no app/ module beside it."
            exit 1
          fi
          echo "dir=$project_dir" >> "$GITHUB_OUTPUT"
          echo "Project root: $project_dir"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run static source validation
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ steps.project.outputs.dir }}"
          python3 validate_project.py
          python3 "$GITHUB_WORKSPACE/scripts/test_battlezone_v6_enhancement.py" "$GITHUB_WORKSPACE/${{ steps.source.outputs.dir }}"
          python3 "$GITHUB_WORKSPACE/scripts/test_v6_runtime_reliability.py" "$GITHUB_WORKSPACE/${{ steps.source.outputs.dir }}"
          python3 "$GITHUB_WORKSPACE/scripts/test_v6_voice_startup_fix.py" "$GITHUB_WORKSPACE/${{ steps.source.outputs.dir }}"
          python3 "$GITHUB_WORKSPACE/scripts/test_v6_gpu_recovery.py" "$GITHUB_WORKSPACE/${{ steps.source.outputs.dir }}"
          python3 "$GITHUB_WORKSPACE/scripts/test_v6_progression_integrity.py" "$GITHUB_WORKSPACE/${{ steps.source.outputs.dir }}"
          python3 "$GITHUB_WORKSPACE/scripts/test_v6_squad_command_system.py" "$GITHUB_WORKSPACE/${{ steps.source.outputs.dir }}"
          python3 "$GITHUB_WORKSPACE/scripts/test_v6_lobby_alignment.py" "$GITHUB_WORKSPACE/${{ steps.source.outputs.dir }}"
          python3 "$GITHUB_WORKSPACE/scripts/test_v6_tactical_command_ui.py" "$GITHUB_WORKSPACE/${{ steps.source.outputs.dir }}"
          python3 "$GITHUB_WORKSPACE/scripts/test_v6_adaptive_enemy_ai.py" "$GITHUB_WORKSPACE/${{ steps.source.outputs.dir }}"
          python3 "$GITHUB_WORKSPACE/scripts/test_v6_animation_action_integration.py" "$GITHUB_WORKSPACE/${{ steps.source.outputs.dir }}"
          python3 "$GITHUB_WORKSPACE/scripts/test_v6_adaptive_graphics.py" "$GITHUB_WORKSPACE/${{ steps.source.outputs.dir }}"
          python3 "$GITHUB_WORKSPACE/scripts/test_v6_offline_webview_security.py" "$GITHUB_WORKSPACE/${{ steps.source.outputs.dir }}"
          python3 "$GITHUB_WORKSPACE/scripts/test_v6_build_hardening.py" "$GITHUB_WORKSPACE/${{ steps.source.outputs.dir }}"
          python3 "$GITHUB_WORKSPACE/scripts/test_battlezone_v6_overhaul.py" "$GITHUB_WORKSPACE/${{ steps.source.outputs.dir }}"
          python3 "$GITHUB_WORKSPACE/scripts/test_v6_world_tactical_integrity.py" "$GITHUB_WORKSPACE/${{ steps.source.outputs.dir }}"
          python3 "$GITHUB_WORKSPACE/scripts/test_v6_tactical_line_of_sight.py" "$GITHUB_WORKSPACE/${{ steps.source.outputs.dir }}"
          python3 "$GITHUB_WORKSPACE/scripts/test_v6_cc0_voiceover.py" "$GITHUB_WORKSPACE/${{ steps.source.outputs.dir }}"
          python3 "$GITHUB_WORKSPACE/scripts/test_v6_runtime_javascript_syntax.py" "$GITHUB_WORKSPACE/${{ steps.source.outputs.dir }}"

      - name: Run unit tests and build debug and unsigned release APKs
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ steps.project.outputs.dir }}"
          test_source_count="$(find app/src/test -type f -name '*.kt' 2>/dev/null | wc -l)"
          if [ "$test_source_count" -lt 1 ]; then
            echo "No Android JVM unit-test sources found; refusing a misleading NO-SOURCE test build." >&2
            exit 1
          fi
          echo "Android JVM unit-test source files: $test_source_count"
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon :app:testDebugUnitTest :app:testReleaseUnitTest :app:assembleDebug :app:assembleRelease
          else
            gradle --no-daemon :app:testDebugUnitTest :app:testReleaseUnitTest :app:assembleDebug :app:assembleRelease
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: BattleZone-debug-APK
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: BattleZone-release-unsigned-APK
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Package patched Android source
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ steps.project.outputs.dir }}"
          find . -type f \( -name '*.download' -o -name '*.replaced-backup' \) -delete
          zip -qr "$GITHUB_WORKSPACE/BattleZone_V6_Offline_Patched_Source.zip" . \
            -x 'build/**' '**/build/**' '.gradle/**' '**/.gradle/**' '.kotlin/**' '**/.kotlin/**' '.git/**' '*/.git/*'
          if zipinfo -1 "$GITHUB_WORKSPACE/BattleZone_V6_Offline_Patched_Source.zip" | grep -v '/$' | grep -Eq '(^|/)(\.gradle|\.kotlin|build)/'; then
            echo "Build caches leaked into the patched source artifact." >&2
            exit 1
          fi

      - name: Upload patched source archive
        uses: actions/upload-artifact@v4
        with:
          name: BattleZone-Offline-Patched-Source
          path: BattleZone_V6_Offline_Patched_Source.zip
          if-no-files-found: error
          retention-days: 14
