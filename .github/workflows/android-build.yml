name: Build WILDBOUND Offline Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract canonical source and install WILDBOUND
        id: source
        shell: bash
        run: |
          set -euo pipefail
          archive="BattleZone_V6_GitHub_Actions_Ready.zip"
          if [ ! -f "$archive" ]; then
            echo "Required canonical source archive not found: $archive"
            exit 1
          fi
          rm -rf _cloud_source
          mkdir _cloud_source
          unzip -oq "$archive" -d _cloud_source
          mkdir -p _cloud_source/.github/workflows
          cp .github/workflows/android-build.yml _cloud_source/.github/workflows/android-build.yml
          python3 scripts/apply_offline_pairing_removal.py _cloud_source
          python3 scripts/apply_gameplay_overhaul.py _cloud_source
          python3 scripts/apply_gameplay_quality.py _cloud_source
          python3 scripts/apply_offline_hub_completion.py _cloud_source
          python3 scripts/apply_battlezone_warroom_redesign.py _cloud_source
          python3 scripts/apply_gameplay_final_polish.py _cloud_source
          python3 scripts/apply_battlezone_feedback_completion.py _cloud_source
          python3 scripts/apply_battlezone_v6_enhancement.py _cloud_source
          python3 scripts/apply_v6_runtime_reliability.py _cloud_source
          python3 scripts/apply_v6_voice_startup_fix.py _cloud_source
          python3 scripts/apply_v6_gpu_recovery.py _cloud_source
          python3 scripts/apply_v6_progression_integrity.py _cloud_source
          python3 scripts/apply_v6_encrypted_backup.py _cloud_source
          python#3 scripts/apply_v6_squad_command_system.py _cloud_source
          python3 scripts/apply_v6_lobby_alignment.py _cloud_source
          python3 scripts/apply_v6_tactical_command_ui.py _cloud_source
          python3 scripts/apply_v6_adaptive_enemy_ai.py _cloud_source
          python3 scripts/apply_v6_animation_action_integration.py _cloud_source
          python3 scripts/apply_v6_adaptive_graphics.py _cloud_source
          python3 scripts/apply_v6_offline_webview_security.py _cloud_source
          python3 scripts/apply_v6_webview_recovery.py _cloud_source
          python3 scripts/apply_v6_build_hardening.py _cloud_source
          python3 scripts/apply_battlezone_v6_overhaul.py _cloud_source
          python3 scripts/apply_battlezone_v6_rigged_weapons.py _cloud_source
          python3 scripts/apply_battlezone_v6_multimodel.py _cloud_source
          python3 scripts/apply_v6_world_tactical_integrity.py _cloud_source
          python3 scripts/apply_v6_map_atlas.py _cloud_source
          python3 scripts/apply_v6_operator_gear_variants.py _cloud_source
          python3 scripts/apply_v6_render_diagnostics.py _cloud_source
          echo "dir=_cloud_source" >> "$GITHUB_OUTPUT"
          echo "Canonical source extracted and offline-only patches applied."

      - name: Locate Android Gradle project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          source_dir="${{ steps.source.outputs.dir }}"
          settings_file="$(find "$source_dir" -type f \= -name settings.gradle o- name settings.gradle.kts [\.\\n."\hs")\\" | head -n 1)"
