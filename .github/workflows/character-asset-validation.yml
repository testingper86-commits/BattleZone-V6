name: Character asset pipeline checks
on:
  workflow_dispatch:
  push:
    paths:
      - 'character-assets/**'
      - 'package.json'
      - '.github/workflows/character-asset-validation.yml'
jobs:
  validator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: npm run check
      - name: Validate usage and error handling
        shell: bash
        run: |
          set +e
          node character-assets/validate_glb.mjs >/tmp/out 2>&1
          result=$?
          set -e
          test "$result" -eq 2
          grep -q 'Usage:' /tmp/out
